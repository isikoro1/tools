name: Haskell Lab checks
on:
  push:
    branches: [main]
    paths:
      - 'haskell-lab/**'
      - '.github/workflows/haskell-lab-checks.yml'
  pull_request:
    paths:
      - 'haskell-lab/**'
      - '.github/workflows/haskell-lab-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix haskell-lab
